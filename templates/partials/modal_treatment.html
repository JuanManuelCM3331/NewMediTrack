  <div id="treatment-modal" class="modal fixed inset-0 z-50 hidden items-center justify-center bg-[#12302a]/60 p-4 backdrop-blur-sm"><form class="modal-card relative max-h-[90vh] w-full max-w-lg overflow-auto rounded-[2rem] bg-white p-6 shadow-lift sm:p-8" id="treatment-form">

    <div class="grid gap-x-3 sm:grid-cols-2">
      <label class="mb-2 mt-5 block text-base font-semibold">Fecha de inicio<input name="start_date" type="date" required class="mt-2 min-h-[52px] w-full rounded-2xl border border-line bg-[#f6f9f4] px-4 py-3 text-lg font-normal outline-none focus:border-brand focus:ring-4 focus:ring-brand/20"></label>

    <button class="mt-5 min-h-[56px] w-full rounded-full bg-brand px-5 py-4 text-lg font-bold text-white shadow-md transition hover:bg-brand-dark focus:outline-none focus:ring-4 focus:ring-brand/30" type="submit">Crear tratamiento</button>
