{% extends "layouts/app.html" %}
{% set active_page = "agenda" %}
{% block title %}MediTrack | Agenda de hoy{% endblock %}
{% block content %}
    <section class="rounded-[2rem] bg-white p-5 shadow-soft sm:p-8">
      <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <span class="grid h-12 w-12 place-items-center rounded-2xl bg-brand-mint text-brand"><i data-icon="calendar" class="h-6 w-6"></i></span>
          <div><p class="text-sm font-bold uppercase tracking-widest text-brand">Seguimiento</p><h2 class="font-serif text-3xl font-semibold leading-tight">Agenda de hoy</h2></div>
        </div>
        <button class="inline-flex min-h-[48px] items-center gap-2 rounded-full bg-[#f1f5f1] px-5 text-base font-bold text-brand-dark transition hover:bg-brand-mint focus:outline-none focus:ring-4 focus:ring-brand/30" id="refresh-button"><i data-icon="refresh" class="h-5 w-5"></i>Actualizar</button>
      </div>
      <div id="dose-list" class="grid grid-cols-[minmax(0,1fr)] gap-4 lg:grid-cols-2"><div class="col-span-full px-2 py-8 text-center text-base text-muted">Cargando tu agenda...</div></div>
    </section>
{% endblock %}
{% block modals %}
{% include "partials/modal_details.html" %}
{% endblock %}
